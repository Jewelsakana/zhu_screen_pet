name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DZHU_SCREEN_PET_BUILD_TESTS=ON
          -DZHU_SCREEN_PET_OPENSSL_RUNTIME_DIR=${{ github.workspace }}/third_party/openssl/win64
      - name: Build and link
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
